services:
  mysql:
    image: mysql:8.4
    container_name: wedding-planner-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-wedding_planner}
      MYSQL_USER: ${DB_USER:-wedding}
      MYSQL_PASSWORD: ${DB_PASSWORD:-weddingpass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - wedding_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  wedding_mysql_data:
